# Sentinel — Docker Compose
#
# Starts the API server and Redis.
# PostgreSQL is hosted on Neon (cloud), so it's not a local container.
#
# Usage:
#   docker-compose up --build        # Build and start everything
#   docker-compose up -d             # Start in background
#   docker-compose down              # Stop everything
#   docker-compose logs -f api       # Follow API logs

services:
  # --- Redis ---
  # BullMQ backend, worker heartbeats, coordination.
  # Data is persisted to a Docker volume so it survives container restarts.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- Sentinel API ---
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override REDIS_URL to use the Docker service name.
      # Inside Docker's network, containers find each other by service name.
      # "redis" resolves to the Redis container's IP automatically.
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Sentinel Schedulers (Phase 10: active/standby leader election) ---
  # Two scheduler instances run simultaneously. Only the leader (the one
  # holding the Redis lease) actually enqueues BullMQ jobs. The standby
  # monitors the lease and takes over within ~TTL+renew (~20s) if the leader
  # crashes, or within ~1 renew interval (~5s) after a graceful shutdown.
  scheduler-a:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      SCHEDULER_ID: scheduler-a
    command: ["node", "-r", "dotenv/config", "src/scheduler/index.js"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler-b:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      SCHEDULER_ID: scheduler-b
    command: ["node", "-r", "dotenv/config", "src/scheduler/index.js"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Sentinel Workers (Phase 4) ---
  # Three worker instances with logical regions.
  # They physically run on the same machine but each has a distinct identity.
  # BullMQ distributes jobs across all connected workers automatically.
  #
  # Scale further with: docker compose up --scale worker-mumbai=2

  worker-mumbai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      WORKER_ID: worker-mumbai-1
      WORKER_REGION: mumbai
      WORKER_CONCURRENCY: 5
    command: ["node", "-r", "dotenv/config", "src/worker/index.js"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-singapore:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      WORKER_ID: worker-singapore-1
      WORKER_REGION: singapore
      WORKER_CONCURRENCY: 5
    command: ["node", "-r", "dotenv/config", "src/worker/index.js"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-frankfurt:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      WORKER_ID: worker-frankfurt-1
      WORKER_REGION: frankfurt
      WORKER_CONCURRENCY: 5
    command: ["node", "-r", "dotenv/config", "src/worker/index.js"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Alert Dispatcher (Phase 9) ---
  # Polls outbox_events and delivers alerts via email (Resend) and webhooks.
  # Separate from the result processor to isolate external I/O from the
  # incident state machine. Multiple instances can run safely (SKIP LOCKED).
  alert-dispatcher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
      LOG_FORMAT: json
      WORKER_ID: alert-dispatcher-1
    command: ["node", "-r", "dotenv/config", "src/alert-dispatcher/index.js"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
